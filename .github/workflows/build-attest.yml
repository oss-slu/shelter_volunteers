name: Build, Attest & Publish (SLSA Level 3)

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'client_app/**'
      - 'server/**'
      - 'docker_files/**'
      - '.github/workflows/build-attest.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-client:
    name: Client SLSA L3 Build & Attestation
    uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
    with:
      image-name: ghcr.io/oss-slu/shelter_volunteers/client
      context: .
      file: docker_files/client_app/Dockerfile.prod
      build-args: |
        PUBLIC_URL=/shelter
        REACT_APP_SERVER_URL=/shelter/api
      sbom-artifact-name: shelter-volunteers-client-sbom
      push: true
    secrets: inherit

  build-server:
    name: Server SLSA L3 Build & Attestation
    uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
    with:
      image-name: ghcr.io/oss-slu/shelter_volunteers/server
      context: .
      file: docker_files/server/Dockerfile.prod
      sbom-artifact-name: shelter-volunteers-server-sbom
      push: true
    secrets: inherit
