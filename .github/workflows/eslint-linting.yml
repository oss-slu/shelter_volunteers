name: Frontend Linting and Formatting

on:
  push:
    branches: [main, staging]
    paths:
      - 'client_app/**'
      - '.github/workflows/eslint-linting.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'client_app/**'
      - '.github/workflows/eslint-linting.yml'

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: |
        cd client_app
        npm install
    - name: Lint
      run: |
        cd client_app
        npm run lint
    - name: Format
      run: |
        cd client_app
        npm run format
