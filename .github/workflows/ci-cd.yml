name: CI/CD (build, push, deploy)

on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: |
          python -m pip install --upgrade pip
          pip install -r ./server/requirements.txt
          pip install pytest
      - run: cd server && PYTHONPATH=$(pwd) pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - run: cd client_app && npm install
      - run: cd client_app && npm test -- --passWithNoTests
      - run: cd client_app && npm run build

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server (production image)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./docker_files/server/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/oss-slu/shelter-volunteers-server:latest
            ghcr.io/oss-slu/shelter-volunteers-server:${{ github.sha }}

      - name: Build and push client (production image)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker_files/client_app/Dockerfile.prod
          push: true
          build-args: |
            REACT_APP_SERVER_URL=${{ vars.REACT_APP_SERVER_URL }}
          tags: |
            ghcr.io/oss-slu/shelter-volunteers-client:latest
            ghcr.io/oss-slu/shelter-volunteers-client:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/shelter_volunteers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Verify health endpoint
        run: |
          sleep 5
          curl -sf https://${{ vars.API_DOMAIN }}/health
