server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: let the app handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
